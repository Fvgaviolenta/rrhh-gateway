server:
  # 8078 en local: puerto asignado al gateway en este entorno de desarrollo
  port: ${SERVER_PORT:8078}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: rrhh-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
      default-filters:
        - name: RequestSize
          args:
            maxSize: 1MB
      routes:
        # 127.0.0.1 (no localhost): en Windows Netty a veces falla al resolver localhost→::1
        - id: identity
          uri: ${RRHH_IDENTITY_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/tenants/**,/api/v1/plataforma/**
        - id: trabajadores
          uri: ${RRHH_TRABAJADORES_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/trabajadores/**,/api/v1/departamentos/**,/api/v1/cargos/**
        - id: contratos
          uri: ${RRHH_CONTRATOS_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/contratos/**,/api/v1/liquidaciones/**
        - id: asistencia
          uri: ${RRHH_ASISTENCIA_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/asistencia/**,/api/v1/marcas-asistencia/**
        - id: ausencias
          uri: ${RRHH_AUSENCIAS_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/ausencias/**,/api/v1/solicitudes-ausencia/**
        - id: notifications
          uri: ${RRHH_NOTIFICATIONS_URL:http://127.0.0.1:8086}
          predicates:
            - Path=/api/v1/notificaciones/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx}
          audiences: ${COGNITO_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false

rrhh:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    replenish: ${RRHH_RATE_LIMIT_REPLENISH:30}
    burst: ${RRHH_RATE_LIMIT_BURST:60}
    backend: ${RRHH_RATE_LIMIT_BACKEND:auto}
