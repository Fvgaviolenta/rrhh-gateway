spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/usuarios/**,/api/v1/tenants/**,/api/v1/plataforma/**

management:
  health:
    redis:
      enabled: false

rrhh:
  rate-limit:
    backend: memory
    replenish: 30
    burst: 60
